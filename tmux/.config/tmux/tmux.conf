# colors are terminal palette numbers (~/dotfiles/colors.conf)
# color0: subtle border, 
# color7: active text, 
# color8: inactive text / active border

set-option -sa terminal-overrides ",xterm*:Tc"
set -g base-index 1
set -g mouse on
set-option -g renumber-windows on

unbind C-b
set -g prefix `
bind ` send-prefix

unbind %
unbind t

bind E select-layout even-horizontal
bind-key R refresh-client

bind S command-prompt -p "New Session:" "new-session -A -s '%%'"
bind-key a choose-tree -Zs
bind X confirm kill-session
bind r split-window -v -c "#{pane_current_path}"
bind e split-window -h -c "#{pane_current_path}"
bind & kill-window
bind x kill-pane
bind c new-window -c "#{pane_current_path}"
bind C-t clock-mode
bind h select-layout even-horizontal
bind v select-layout even-vertical

# Status Bar
set-option -g status-position bottom
set-option -g status-style bg=default
set-option -g status-left-length 20
set-option -g status-left "#{?client_prefix,#[fg=color7]#[bold],#[fg=color8]}#S "
set-option -g status-right-length 100
set-option -g status-right "#{?client_prefix,#[fg=color7]#[bold],#[fg=color8]}#(git -C '#{pane_current_path}' branch --show-current)"
set-option -g status-interval 5
set-option -g status-right-style fg=color8
set-option -g status-justify left
set-window-option -g window-status-format "#[fg=color8] • "
set-window-option -g window-status-current-format "#{?window_zoomed_flag,#[fg=cyan],#[fg=color7]}#[bg=default]#[bold] • "

# Panes
set -g pane-border-style fg=color0
set -g pane-active-border-style fg=color8

# Floating windows
set -g popup-style bg=default,fg=color7
set -g popup-border-style fg=color8
set -g popup-border-lines rounded

# Copy mode
set -g mode-style bg=color8,fg=color7
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
setw -g mode-keys vi

bind t display-popup -E ""
bind s display-popup -E -w 60% -h 40% "tmux list-sessions | sed 's/:.*//' | fzf --reverse | xargs tmux switch-client -t"

bind-key k select-pane -U \; resize-pane -y 999
bind-key j select-pane -D \; resize-pane -y 999

#tpm
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'off'
set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'
