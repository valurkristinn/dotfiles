term xterm-256color

window_padding_width 20 25
hide_window_decorations titlebar-only
macos_option_as_alt left

include ${HOME}/dotfiles/colors.conf

font_family family="Liga SFMono Nerd Font" style="Semibold"
italic_font family="Liga SFMono Nerd Font" style="Semibold Italic"
font_size 15

cursor_shape beam
cursor_blink_interval 0

mouse_hide_wait -1
